# SITE CONFIGURATION
baseurl: ""
url: "https://senthilneutranlab.github.io"

# THEME-SPECIFIC CONFIGURATION
title: Senthil's laboratory                                    # site's title
description: "Senthil's Neurodegeneration and Translational Biology Laboratory - NeuTran Lab"  # used by search engines
avatar: assets/img/lablogo_bg_cropped.svg                          # Empty for no avatar in navbar
favicon: assets/img/lablogo_bg_cropped.svg                         # Icon displayed in the tab

# Header and footer text
header_text: Neurodegeneration and Translational Biology  # Change Blog header text
header_feature_image: neutran-lab-logo.jpeg
header_feature_image_responsive: true

footer_text: >
  Senthil's NeuTran Lab | NCCS Pune © 2026. All rights reserved.
  <br>
  Website by <a href="https://github.com/MuzzammilB" target="_blank" rel="noopener noreferrer">Muzzammil B</a>
  · Powered by <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a> · Built with <a href="https://github.com/sylhare/Type-on-Strap" target="_blank" rel="noopener noreferrer">Type-on-Strap</a>.

# Blog
excerpt: true                                           # Or "truncate" (first 250 characters), "false" to disable
post_navigation: true
color_image: /assets/img/lineart.png                    # A bit transparent for color posts.

# Features
# More in the _data folder for comments, share buttons, author and language
# For layout customization, go to the "_sass > base" folder, and check "_variables.scss"
katex: false                                            # Enable if using math markup
mermaid: false                                          # Enable mermaid-js for diagrams, use theme: base, forest, dark, default, neutral
google_analytics:                                       # Measurement ID, e.g. "G-00000"
cookie_consent: false                                   # To respect the usage of cookies
color_theme: auto                                       # auto, dark or light

# PAGINATION
paginate: 5
paginate_path: "/blog/page:num"

# PORTFOLIO
collections:
  portfolio:
    output: true
    permalink: /:collection/:name

  labouting:
    output: true
    permalink: /lablife/labouting/:name/

  conference:
    output: true
    permalink: /lablife/conference/:name/

# BUILD SETTINGS
sass:
  style: compressed
  quiet_deps: true
plugins: [jekyll-paginate, jekyll-seo-tag, jekyll-feed]
exclude:
  - ".idea"
  - ".jekyll-cache"
  - ".jekyll-metadata"
  - ".sass-cache"
  - "Gemfile"
  - "Gemfile.lock"
  - "type-on-strap.gemspec"
  - "vendor"
  - "node_modules"
  - "assets/node_modules"
  - "assets/Dockerfile"
  - "package.json"
  - "package-lock.json"
  - "README.md"
  - "LICENSE"
  - ".github"
  - "test-results"